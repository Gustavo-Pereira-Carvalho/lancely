<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Projetos</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/projetos.css">
</head>
<body>

<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo-box">
        <img src="assets/logo.png">
        <span>Lancely</span>
      </div>

      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="projetos.html" class="active">Projetos</a>
      </nav>
    </div>

    <!-- opcional, mas recomendado -->
    <div class="plan-box">
      <h4>Plano</h4>
      <p>Limites ativos</p>

      <div class="progress">
        <div class="bar"></div>
      </div>

      <button onclick="window.location.href='planos.html'">
        Upgrade
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <h1>Projetos</h1>

      <div class="top-actions">
        <input
          id="buscarProjeto"
          class="search"
          type="text"
          placeholder="Buscar projeto..."
        >
      </div>
    </div>

    <!-- NOVO PROJETO -->
    <div class="box">
      <h3>Novo Projeto</h3>

      <div class="form-row">
        <input
          id="projetoNome"
          type="text"
          placeholder="Nome do projeto"
        >

        <input
          id="projetoValor"
          type="number"
          placeholder="Valor"
        >

        <select id="clienteSelect"></select>

        <input
          id="projetoPrazo"
          type="date"
        >

        <button id="btnAddProjeto">
          Adicionar
        </button>
      </div>
    </div>

    <!-- FILTROS -->
    <div class="filtros">
      <button class="active" onclick="filtrarProjetos('todos')">
        Todos
      </button>

      <button onclick="filtrarProjetos('pendentes')">
        Pendentes
      </button>

      <button onclick="filtrarProjetos('pagos')">
        Pagos
      </button>
    </div>

    <!-- LISTA -->
    <div class="box">
      <ul id="listaProjetos"></ul>
    </div>

  </main>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
