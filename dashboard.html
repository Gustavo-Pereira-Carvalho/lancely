<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Lancely Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<div class="container">

  <aside class="sidebar">
    <div>
      <div class="logo-box">
        <img src="assets/logo.png" />
        <span>Lancely</span>
      </div>

      <nav>
        <a class="active">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="projetos.html">Projetos</a>
      </nav>
    </div>

    <div class="plan-box">
      <h4>Plano Free</h4>
      <p>Limites ativos</p>

      <div class="progress">
        <div class="bar"></div>
      </div>

      <button onclick="irPlanos()">Upgrade</button>
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div>
        <h1 id="saudacao">Bom dia 👋</h1>
        <p>Aqui está um resumo do seu trabalho hoje.</p>
      </div>

      <div class="top-actions">
        <input placeholder="Buscar..." class="search" />

        <!-- USER -->
        <div class="user-box" onclick="toggleUserMenu()">
          <img src="https://i.pravatar.cc/40" />

          <div>
            <strong id="userNome">Usuário</strong>
            <span>Freelancer</span>
          </div>

          <!-- MENU -->
          <div id="userMenu" class="user-menu">
            <p id="menuNome"></p>
            <small id="menuEmail"></small>

            <hr />

            <button onclick="irPerfil()">Perfil</button>
            <button onclick="logout()">Sair</button>
          </div>
        </div>

      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="icon">💰</div>
        <div>
          <span>Ganhos</span>
          <h2 id="ganhos">R$ 0</h2>
        </div>
      </div>

      <div class="card">
        <div class="icon">📁</div>
        <div>
          <span>Projetos</span>
          <h2 id="totalProjetos">0</h2>
        </div>
      </div>

      <div class="card">
        <div class="icon">✅</div>
        <div>
          <span>Concluídos</span>
          <h2 id="concluidos">0</h2>
        </div>
      </div>

      <div class="card">
        <div class="icon">⏳</div>
        <div>
          <span>Pendentes</span>
          <h2 id="pendentes">0</h2>
        </div>
      </div>
    </div>

    <div class="grid">

<div class="box box-grafico">

  <div class="grafico-header">
    <h3>
      Ganhos
      <span id="badgePro" class="badge-pro"></span>
    </h3>

    <!-- FILTROS (SÓ PRO) -->
    <div id="filtros" class="filtros">
      <button onclick="setPeriodo(7)">7d</button>
      <button onclick="setPeriodo(30)">30d</button>
      <button onclick="setPeriodo(365)">12m</button>
    </div>
  </div>

  <canvas id="grafico"></canvas>

</div>

      <div class="box">
        <h3>Projetos recentes</h3>
        <ul id="listaProjetos"></ul>
      </div>

      <div class="box">
        <h3>Prazos</h3>
        <ul></ul>
      </div>

      <div class="box">
        <h3>Clientes</h3>
        <ul id="listaClientes"></ul>
      </div>

    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
